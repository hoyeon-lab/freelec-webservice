name: Deploy to EC2 with CodeDeploy

on:
  push:
    branches:
      - main

env:
  PROJECT_NAME: freelec-webservice
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  AWS_REGION: ap-northeast-2
  CODE_DEPLOY_APPLICATION: freelec-webservice
  CODE_DEPLOY_DEPLOYMENT_GROUP: freelec-webservice-group

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Make deployment package
        run: |
          mkdir -p before-deploy
          cp scripts/*.sh before-deploy/
          cp appspec.yml before-deploy/
          cp build/libs/*.jar before-deploy/
          chmod +x before-deploy/*.sh
          cd before-deploy
          zip -r before-deploy.zip *
          cd ../
          mkdir -p deploy
          mv before-deploy/before-deploy.zip deploy/$PROJECT_NAME.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 cp deploy/$PROJECT_NAME.zip s3://$S3_BUCKET/$PROJECT_NAME.zip --acl private

      - name: Request CodeDeploy deployment
        run: |
          aws deploy create-deployment \
            --application-name $CODE_DEPLOY_APPLICATION \
            --deployment-group-name $CODE_DEPLOY_DEPLOYMENT_GROUP \
            --s3-location bucket=$S3_BUCKET,bundleType=zip,key=$PROJECT_NAME.zip \
            --region $AWS_REGION